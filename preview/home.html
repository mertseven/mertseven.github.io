<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="alternate" hreflang="en" href="https://mertseven.com/">
  <link rel="alternate" hreflang="tr" href="https://mertseven.com/tr/">
  <link rel="alternate" hreflang="x-default" href="https://mertseven.com/">

  <title>Home Preview</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Mert Seven, PhD. A new media scholar and digital crafter building interactive systems as critical inquiry. Search projects and research.">
  <meta name="robots" content="max-image-preview:large">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mert Seven">
  <meta property="og:locale" content="en_US">
  <meta property="og:url" content="https://mertseven.com">
  <meta property="og:title" content="Mert Seven">
  <meta property="og:description" content="Interactive systems, data visualizations and critical inquiries into digital culture.">
  <meta property="og:image" content="https://mertseven.com/images/webcard.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://mertseven.com/images/webcard.png">

  <link rel="icon" href="/images/ms-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;600&family=Instrument+Serif:ital@1&display=swap">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/search-box.css">
  <link rel="stylesheet" href="/assets/css/projects.css">
  <link rel="stylesheet" href="/assets/css/home.css">
  <link rel="stylesheet" href="/preview/home-below.css">
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body class="home">
  <div class="first">
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Mert Seven, home">
      <span class="wordmark-mark" aria-hidden="true"></span>
      <span>Mert Seven</span>
    </a>
    <div class="header-end">
      <nav class="site-nav" aria-label="Main">
        <a href="/work/">Index</a>
        <a href="/research/">Research</a>
        <a href="/about/">About</a>
      </nav>
      <div class="header-icons">
        <a class="icon-btn lang-btn" data-lang-switch href="/tr/" hreflang="tr" lang="tr" aria-label="Türkçe">TR</a>
        <a class="icon-btn" href="/search/" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </a>
        <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="home-main">
  <section class="names-wall" id="names" aria-label="Projects"></section>

  <section class="stage" id="find">
    <div class="stage-inner">
      <h1 class="prompt" id="prompt"><span class="prompt-line">what are you <em>curious</em> about?</span></h1>

      <div class="search" id="search">
        <form class="search-bar" role="search" autocomplete="off" onsubmit="return false">
          <label class="visually-hidden" for="q">Search projects and research</label>
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span class="search-field">
            <input id="q" type="search" placeholder="Search projects and research…"
                   aria-controls="names" spellcheck="false">
            <span class="ghost" id="ghost" aria-hidden="true"></span>
          </span>
          <span class="search-hint"><kbd>/</kbd></span>
        </form>

        <p class="beneath" id="beneath"></p>
      </div>
    </div>
  </section>
  </main>
  </div>

  <main class="below" id="below"></main>
  <aside class="hb-pill" id="variants" aria-label="Layouts"></aside>
  <span id="year" hidden></span>

  <script type="module" src="/assets/js/home.js"></script>
  <script type="module" src="/preview/home-below.js"></script>
</body>
</html>
