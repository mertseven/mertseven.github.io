<!doctype html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duvar Önizleme · Salon</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/ms-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    /* A scratch page for comparing directions for the home wall. Not linked from the site. */

    body { overflow-x: hidden; }

    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      gap: var(--s-3);
      padding: var(--s-4) var(--gutter);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .bar-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; }
    .bar h1 { margin: 0; font-size: var(--text-md); font-weight: var(--weight-medium); }
    .bar h1 span { color: var(--ink-3); font-weight: var(--weight-regular); }
    .modes { display: flex; flex-wrap: wrap; gap: var(--s-2); }
    .modes .chip--pick { border-style: solid; border-color: var(--ink); }
    .modes .chip[aria-pressed="true"].chip--pick { background: var(--ink); color: var(--paper); }
    .about { margin: 0; max-width: 78ch; font-size: var(--text-sm); color: var(--ink-2); line-height: 1.55; }
    .about b { color: var(--ink); font-weight: var(--weight-medium); }

    .stage {
      position: relative;
      height: calc(100vh - var(--bar-h, 150px));
      min-height: 460px;
      overflow: hidden;
      background: var(--paper);
    }

    /* Cards, shared by every scene */

    .c {
      position: relative;
      display: flex;
      flex-direction: column;
      margin: 0;
      color: inherit;
      text-decoration: none;
    }
    .c-img {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--paper-raised);
    }
    .c-img img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      transition: filter 420ms var(--ease), transform 420ms var(--ease);
    }
    .c:hover .c-img img { transform: scale(1.03); }
    .c-type {
      display: flex;
      align-items: flex-end;
      height: 100%;
      padding: var(--s-3);
      font-size: var(--text-md);
      font-weight: var(--weight-light);
      line-height: 1.15;
    }

    /* 1 · Print: ink on paper, halftone dots, colour only under the cursor */
    .is-print .c-img { background: var(--paper); }
    .is-print .c-img img { filter: grayscale(1) contrast(1.35) brightness(1.06); mix-blend-mode: multiply; }
    .is-print .c-img::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(22, 23, 27, 0.5) 0.85px, transparent 1.15px);
      background-size: 3.5px 3.5px;
      mix-blend-mode: multiply;
      opacity: 0.6;
      transition: opacity 420ms var(--ease);
    }
    .is-print .c:hover .c-img img { filter: none; mix-blend-mode: normal; }
    .is-print .c:hover .c-img::after { opacity: 0; }

    /* 3 · Museum label: number, title, collection and medium, set like a wall caption */
    .c-cap { display: none; }
    .is-labels .c-cap {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0 var(--s-2);
      padding-top: 8px;
      font-size: 0.6875rem;
      line-height: 1.35;
    }
    .c-no { font-family: var(--font-mono); color: var(--ink-3); }
    .c-title { font-weight: var(--weight-medium); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .c-med { grid-column: 2; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 4 · Not only projects: lines from papers, numbers, verse */
    .t {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--s-3);
      padding: var(--s-4);
      border-top: 1px solid var(--ink);
      color: var(--ink);
      overflow: hidden;
    }
    .t-kind { font-family: var(--font-mono); font-size: 0.625rem; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--ink-3); }
    .t-quote { font-family: var(--font-serif); font-style: italic; font-size: clamp(1.05rem, 0.75rem + 0.8vw, 1.6rem); line-height: 1.18; }
    .rows .t-quote { font-size: 1.05rem; }
    .t-num { display: flex; align-items: baseline; gap: var(--s-3); font-size: clamp(2rem, 1.2rem + 1.8vw, 3.2rem); font-weight: var(--weight-light); letter-spacing: var(--tracking-display); line-height: 0.95; }
    .t-num small { font-size: var(--text-xs); line-height: 1.35; letter-spacing: 0; color: var(--ink-2); }
    .t-src { font-size: 0.6875rem; color: var(--ink-3); }

    /* 0 · Rows: uniform 16:9 strips, the current wall flattened */
    .rows { position: absolute; inset: 0; display: grid; align-content: center; gap: 16px; }
    .rows .track { display: flex; gap: 16px; width: max-content; animation: drift var(--dur) linear infinite; }
    .rows .track.rev { animation-direction: reverse; }
    .rows .c { width: var(--cw); }
    .rows .c-img { flex: none; height: calc(var(--cw) * 0.5625); }
    @keyframes drift { to { transform: translateX(calc(-50% - 8px)); } }

    /* 2 · Salon hang: sizes by weight, packed densely, drifting slowly as one wall */
    .salon { position: absolute; inset: 0; display: flex; align-items: center; }
    .salon .run {
      display: flex;
      gap: var(--g);
      width: max-content;
      animation: drift var(--dur) linear infinite;
    }
    .salon .grid {
      display: grid;
      grid-auto-flow: column dense;
      grid-template-rows: repeat(4, var(--rh));
      grid-auto-columns: var(--cw);
      gap: var(--g);
    }
    .salon .s-xl { grid-column: span 3; grid-row: span 2; }
    .salon .s-w  { grid-column: span 2; grid-row: span 1; }
    .salon .s-l  { grid-column: span 2; grid-row: span 2; }
    .salon .s-t  { grid-column: span 1; grid-row: span 2; }
    .salon .s-s  { grid-column: span 1; grid-row: span 1; }
    .stage:hover .run, .stage:hover .track { animation-play-state: paused; }

    /* 5 · Shoal: loose cards drifting like fish, shying from the cursor */
    .shoal .c { position: absolute; top: 0; left: 0; will-change: transform; }
    .shoal .c-img { flex: none; }

    /* 6 · Field: projects as a network, linked by shared topics */
    .field svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .field line { stroke: var(--line-strong); stroke-width: 1; transition: stroke 200ms, opacity 200ms; }
    .field .c { position: absolute; top: 0; left: 0; transition: opacity 200ms; }
    .field .c-img { flex: none; box-shadow: 0 0 0 1px var(--line); }
    .field.is-hover line { opacity: 0.15; }
    .field.is-hover line.on { opacity: 1; stroke: var(--ink); }
    .field.is-hover .c { opacity: 0.25; }
    .field.is-hover .c.on { opacity: 1; }
    .field .topic {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--ink-3);
      pointer-events: none;
    }

    .note {
      margin: 0;
      padding: var(--s-4) var(--gutter) var(--s-6);
      font-size: var(--text-xs);
      color: var(--ink-3);
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <header class="bar" id="bar">
    <div class="bar-top">
      <h1>Duvar önizleme <span>· Netflix gibi durmasın diye yönler</span></h1>
      <a class="label" href="/">← siteye dön</a>
    </div>
    <div class="modes" id="modes"></div>
    <p class="about" id="about"></p>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <p class="note">Kartların içeriği sitedeki katalogdan geliyor. Yıl bilgisi katalogda olmadığı için müze etiketinde yıl yerine koleksiyon yazıyor. Sahnenin üzerine gelince kayma duruyor.</p>

  <script type="module" src="/preview/salon.js"></script>
</body>
</html>
