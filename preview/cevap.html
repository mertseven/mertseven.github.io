<!doctype html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cevap Duvarı · İsimlerle</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/ms-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/preview/salon.css">
  <style>
    /* A + B: the answer wall with the name wall, three ways. Scratch page. */

    /* The names keep clear of the question at the bottom. */
    .names-area { position: absolute; inset: 0 0 150px 0; }
    .names-area .names { font-size: clamp(2rem, 0.8rem + 4vw, 5rem); }

    /* States the scenes switch on the names. */
    .nm.hint { color: var(--ink); font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
    .names.is-q .track { animation-play-state: paused; }
    .names.is-q .nm { color: var(--ink-4); }
    .names.is-q .nm.hit { color: var(--ink); font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
    .names .nm { transition: color 320ms var(--ease), opacity 320ms var(--ease); }

    /* 1 · Cards fly out of their names */
    .fly { position: absolute; top: 0; left: 0; z-index: 30; width: var(--fw); box-shadow: 0 24px 50px -26px rgba(0, 0, 0, 0.5); }
    .fly .c-img { flex: none; height: calc(var(--fw) * 0.5625); }
    .fly .c-cap { display: grid; padding: 8px 10px; background: var(--paper-raised); }

    /* 2 · Watermark: the names, very faint, behind the answer wall */
    .watermark { position: absolute; inset: 0; pointer-events: none; }
    .watermark .names { font-size: clamp(3rem, 1rem + 7vw, 8rem); }
    .watermark .nm { color: var(--ink); opacity: 0.07; }
    .watermark .nm.hit { opacity: 0.22; font-family: var(--font-serif); font-style: italic; font-weight: 400; }

    /* 3 · The answer is a list of names */
    .names-area .names { transition: opacity 420ms var(--ease); }
    .names-area.is-listing .names { opacity: 0.08; pointer-events: none; }
    .answer-list {
      position: absolute;
      inset: 0 0 150px 0;
      z-index: 20;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 2px;
      pointer-events: none;
    }
    .answer-list a {
      display: inline-flex;
      align-items: baseline;
      gap: 0.35em;
      font-size: clamp(1.8rem, 1rem + 2.6vw, 3.6rem);
      font-weight: var(--weight-light);
      letter-spacing: var(--tracking-display);
      line-height: 1.1;
      color: var(--ink);
      pointer-events: auto;
      transition: color 200ms var(--ease);
    }
    .answer-list a sup { font-family: var(--font-mono); font-size: 0.2em; letter-spacing: var(--tracking-label); color: var(--ink-3); transform: translateY(-1.6em); }
    .answer-list a .k { font-family: var(--font-mono); font-size: 0.2em; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--ink-3); }
    .answer-list a:hover { font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
    .answer-list.has-hover a:not(:hover) { color: var(--ink-4); }
    .answer-list .none { font-size: var(--text-md); color: var(--ink-3); }

    /* 4 · Names with marks, curved */

    /* Placeholder marks until each project has its own logo. */
    .mk { flex: none; width: 0.78em; height: 0.78em; align-self: center; color: currentColor; }
    .mk .cut { stroke: var(--paper); } /* the cut in a filled mark is paper, not ink */

    /* At rest: the names drift in rows bent like a cinema screen (placed by script). */
    .curve {
      position: absolute;
      inset: 0 0 150px 0;
      overflow: hidden;
      perspective: 1200px;
      transition: opacity 420ms var(--ease);
    }
    .curve-field { position: absolute; inset: 0; transform-style: preserve-3d; }
    .cn {
      position: absolute;
      top: 0;
      left: 0;
      display: inline-flex;
      align-items: baseline;
      gap: 0.32em;
      font-size: clamp(2rem, 0.8rem + 3.8vw, 4.6rem);
      font-weight: var(--weight-light);
      letter-spacing: var(--tracking-display);
      line-height: 1.1;
      white-space: nowrap;
      color: var(--ink);
      will-change: transform;
      backface-visibility: hidden;
      transition: color 320ms var(--ease);
    }
    .cn sup { font-family: var(--font-mono); font-size: 0.16em; letter-spacing: var(--tracking-label); color: var(--ink-3); transform: translateY(-1.8em); }
    .cn.k-Teaching { color: var(--ink-2); }
    .cn.k-Experiment { color: var(--ink-3); }
    .cn.hint { color: var(--ink); font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
    .curve.has-hover .cn { color: var(--ink-4); }
    .curve.has-hover .cn.on { color: var(--ink); font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
    .curve.is-listing { opacity: 0.07; pointer-events: none; }

    /* The answer: a drum of names turning on a horizontal axis; the wheel turns it. */
    .drum {
      position: absolute;
      inset: 0 0 150px 0;
      z-index: 20;
      perspective: 1000px;
      pointer-events: none;
    }
    .drum-axis { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
    .dn {
      position: absolute;
      left: 0;
      top: 0;
      display: inline-flex;
      align-items: baseline;
      gap: 0.32em;
      font-size: clamp(1.8rem, 1rem + 2.6vw, 3.6rem);
      font-weight: var(--weight-light);
      letter-spacing: var(--tracking-display);
      line-height: 1;
      white-space: nowrap;
      color: var(--ink);
      backface-visibility: hidden;
      pointer-events: auto;
      transition: color 200ms var(--ease);
    }
    .dn .k { font-family: var(--font-mono); font-size: 0.2em; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--ink-3); }
    .dn sup { font-family: var(--font-mono); font-size: 0.2em; color: var(--ink-3); transform: translateY(-1.6em); }
    .dn.is-front, .dn:hover { font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
    .drum.is-active { pointer-events: auto; }
    .drum .none { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--ink-3); }
  </style>
</head>
<body>
  <header class="bar" id="bar">
    <div class="bar-top">
      <h1>Cevap duvarı + isim duvarı <span>· üç birleşim</span></h1>
      <a class="label" href="/preview/salon.html#answer">← tüm yönler</a>
    </div>
    <div class="modes" id="modes"></div>
    <p class="about" id="about"></p>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <p class="note">Hepsinde aşağıdaki kutuya yazmayı dene: <b>philosophy</b>, <b>journalism</b>, <b>networks</b>, <b>teaching</b>. Kutu boşken dönen ipucunun projeleri isimlerde italik olarak öne çıkıyor. Bir ismin üzerine gelince görseli imlecin yanında beliriyor.</p>
  <div class="peek" id="peek" aria-hidden="true"></div>

  <script type="module" src="/preview/cevap.js"></script>
</body>
</html>
