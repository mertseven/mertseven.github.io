<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perde Önizleme</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/ms-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;600&family=Instrument+Serif:ital@1&display=swap">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/preview/perde.css">
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body class="perde-page">
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Mert Seven, home">
      <span class="wordmark-mark" aria-hidden="true"></span>
      <span>Mert Seven</span>
    </a>
    <div class="header-end">
      <nav class="site-nav" aria-label="Main">
        <a href="/work/">Index</a>
        <a href="/research/">Research</a>
        <a href="/about/">About</a>
      </nav>
      <div class="header-icons">
        <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <section class="drape" id="drape" aria-label="Featured work">
    <div class="banner" aria-live="polite"></div>
  </section>

  <div class="pal" id="palette" role="group" aria-label="Silk"></div>

  <script type="module">
    import "/assets/js/theme.js";
    import "/preview/perde.js";
  </script>
</body>
</html>
